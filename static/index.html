<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion monitor</title>
<style>
  :root { --bg:#f2f4f3; --panel:#fff; --ink:#1b2420; --muted:#5d6b64; --line:#d6dcd8; --ok:#2f7d5b; --alert:#d6401f; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, "Segoe UI", Arial, sans-serif; margin: 0; background: var(--bg); color: var(--ink); line-height: 1.5; }
  header { background: #1b2420; color: #fff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 1.2rem; margin: 0; }
  h2 { font-size: 1rem; margin: 0 0 10px; }
  #updated { color: #b8c4bd; font-size: .9rem; }
  main { max-width: 960px; margin: 0 auto; padding: 16px 20px 40px; display: grid; gap: 16px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  .stats { display: flex; gap: 32px; flex-wrap: wrap; }
  .stats b { display: block; font-size: 1.6rem; font-weight: 600; line-height: 1.2; }
  .stats span, .muted { color: var(--muted); font-size: .9rem; }
  select { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  canvas { width: 100%; height: 170px; display: block; background: #f7f9f8; border-radius: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .grid img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 4px; display: block; background: #e3e9e5; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  td img { width: 56px; height: 42px; object-fit: cover; border-radius: 3px; display: block; }
  #error { background: #fbe7e2; border: 1px solid var(--alert); color: #7a2412; padding: 10px 14px; border-radius: 8px; display: none; }
  #toasts { position: fixed; top: 12px; right: 12px; display: grid; gap: 8px; z-index: 10; max-width: 320px; }
  .toast { display: flex; gap: 10px; align-items: center; background: #fff; border: 1px solid var(--line);
           border-left: 5px solid var(--alert); border-radius: 8px; padding: 10px 12px; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .toast img { width: 64px; height: 48px; object-fit: cover; border-radius: 3px; }
  .hr { display: flex; align-items: center; gap: 12px; }
  header button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid #5d6b64; background: #fff; color: #1b2420; cursor: pointer; }
</style>
</head>
<body>
<div id="toasts" aria-live="assertive"></div>
<header><h1>Motion monitor</h1><div class="hr"><span id="updated">Loading...</span><button id="alertBtn">Enable alerts</button></div></header>
<main>
  <div id="error"></div>
  <section>
    <div class="stats">
      <div><b id="total">0</b><span>total detections</span></div>
      <div><b id="today">0</b><span>today</span></div>
      <div><b id="last">none</b><span>last detection</span></div>
    </div>
  </section>
  <section>
    <div class="head"><h2>Sensor graph: detections over time</h2>
      <select id="range"><option value="hour">Last hour (per minute)</option><option value="day">Last 24 hours (per hour)</option></select></div>
    <canvas id="graph"></canvas>
  </section>
  <section>
    <h2>Camera captures</h2>
    <div id="caps" class="grid"></div>
    <p id="noCaps" class="muted">No pictures yet.</p>
  </section>
  <section>
    <h2>Event log</h2>
    <table><thead><tr><th>Time</th><th>Picture</th><th>File</th><th>Email</th></tr></thead><tbody id="log"></tbody></table>
    <p id="noLog" class="muted">No events yet.</p>
  </section>
</main>
<script>
var $ = function (id) { return document.getElementById(id); };
var data = [];

function fmt(d) { return d.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" }); }

function drawGraph() {
  var c = $("graph"), dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  c.width = w * dpr; c.height = h * dpr;
  var g = c.getContext("2d"); g.scale(dpr, dpr); g.clearRect(0, 0, w, h);
  var hour = $("range").value === "hour";
  var buckets = hour ? 60 : 24, size = hour ? 60000 : 3600000;
  var now = Date.now(), start = now - buckets * size, counts = [];
  for (var i = 0; i < buckets; i++) counts.push(0);
  data.forEach(function (e) {
    var t = new Date(e.detected_at).getTime();
    if (t >= start && t <= now) counts[Math.min(buckets - 1, Math.floor((t - start) / size))]++;
  });
  var max = Math.max(1, Math.max.apply(null, counts));
  var padL = 28, padB = 22, pw = w - padL - 6, ph = h - padB - 10, bw = pw / buckets;
  g.fillStyle = "#5d6b64"; g.font = "12px system-ui, sans-serif"; g.textAlign = "right";
  g.fillText(String(max), padL - 6, 14); g.fillText("0", padL - 6, h - padB);
  g.strokeStyle = "#d6dcd8"; g.beginPath(); g.moveTo(padL, h - padB); g.lineTo(w - 6, h - padB); g.stroke();
  counts.forEach(function (n, i) {
    if (!n) return;
    var bh = (n / max) * ph;
    g.fillStyle = "#d6401f"; g.fillRect(padL + i * bw + 1, h - padB - bh, Math.max(2, bw - 2), bh);
  });
  g.fillStyle = "#5d6b64"; g.textAlign = "left"; g.fillText(hour ? "60 min ago" : "24 h ago", padL, h - 6);
  g.textAlign = "right"; g.fillText("now", w - 6, h - 6);
}

function render() {
  var now = new Date(), startDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  $("total").textContent = data.length >= 500 ? "500+" : data.length;
  $("today").textContent = data.filter(function (e) { return new Date(e.detected_at).getTime() >= startDay; }).length;
  $("last").textContent = data.length ? fmt(new Date(data[0].detected_at)) : "none";
  drawGraph();
  var caps = data.filter(function (e) { return e.image_url; }).slice(0, 8);
  $("noCaps").style.display = caps.length ? "none" : "block";
  $("caps").innerHTML = caps.map(function (e) {
    return '<div><a href="' + e.image_url + '" target="_blank"><img src="' + e.image_url + '" alt="Capture" loading="lazy"></a><small class="muted">' + fmt(new Date(e.detected_at)) + "</small></div>";
  }).join("");
  var rows = data.slice(0, 20);
  $("noLog").style.display = rows.length ? "none" : "block";
  $("log").innerHTML = rows.map(function (e) {
    var pic = e.image_url ? '<img src="' + e.image_url + '" alt="">' : "-";
    return "<tr><td>" + fmt(new Date(e.detected_at)) + "</td><td>" + pic + "</td><td>" + (e.image_file || "") + "</td><td>" + (e.email_status || "") + "</td></tr>";
  }).join("");
}

function load() {
  fetch("/api/events").then(function (r) { return r.json(); }).then(function (j) {
    if (j.error) { $("error").style.display = "block"; $("error").textContent = j.error + " " + (j.detail || ""); return; }
    $("error").style.display = "none"; data = j.events; checkNew(); render();
    $("updated").textContent = "Updated " + new Date().toLocaleTimeString();
  }).catch(function () { $("updated").textContent = "Cannot reach server"; });
}
var lastId = null, alertsOn = false, audioCtx = null, baseTitle = document.title;

$("alertBtn").onclick = function () {
  alertsOn = !alertsOn;
  $("alertBtn").textContent = alertsOn ? "Alerts: ON" : "Enable alerts";
  if (alertsOn) {
    try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
    beep();
  }
};

function beep() {
  if (!audioCtx) return;
  var o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = "square"; o.frequency.value = 880; g.gain.value = 0.15;
  o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.4);
}

function showToast(e) {
  var when = fmt(new Date(e.detected_at));
  var t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role", "alert");
  t.innerHTML = (e.image_url ? '<img src="' + e.image_url + '" alt="">' : "") +
                "<div><b>Motion detected</b><br><small>" + when + "</small></div>";
  $("toasts").appendChild(t);
  setTimeout(function () { t.remove(); }, 10000);
  if (alertsOn) {
    beep();
    if ("Notification" in window && Notification.permission === "granted") {
      try { new Notification("Motion detected", { body: when, icon: e.image_url || undefined }); } catch (err) {}
    }
  }
  if (document.hidden) document.title = "(!) Motion detected";
}
document.addEventListener("visibilitychange", function () { if (!document.hidden) document.title = baseTitle; });

function checkNew() {
  if (!data.length) { if (lastId === null) lastId = 0; return; }
  var top = data[0].id;
  if (lastId === null) { lastId = top; return; }
  var fresh = data.filter(function (e) { return e.id > lastId; }).reverse();
  lastId = Math.max(lastId, top);
  fresh.forEach(showToast);
}

$("range").onchange = drawGraph;
load(); setInterval(load, 5000);
window.addEventListener("resize", drawGraph);
</script>
</body>
</html>
